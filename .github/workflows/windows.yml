name: Windows auto-update release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron check-mini-program.cjs
      - name: Check tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package versions differ' }
      - run: npm run dist:win
      - run: npx electron check-update-download.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: xiaobaobei-ledger-auto-update-windows
          path: |
            installer/*.exe
            installer/*.blockmap
            installer/latest.yml
          retention-days: 30
      - name: Publish installer and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseTag = "v$version"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --target $env:GITHUB_SHA --title "小宝贝记账本 $releaseTag · 自动更新版" --notes '首次安装 Setup.exe 一次。此后后台检查并下载新版，正常关闭软件后自动安装，下次打开生效。保留原有账目与价格设置。旧 ZIP 版需要安装本版才能启用自动更新。'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem installer -File | Where-Object { $_.Extension -in '.exe','.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName)
          if ($assets.Count -lt 3) { throw 'Installer or update manifests missing' }
          gh release upload $releaseTag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
