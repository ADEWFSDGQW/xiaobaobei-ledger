name: Windows build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron check-mini-program.cjs
      - run: npm run package:win
      - name: Compress Windows app
        shell: pwsh
        run: Compress-Archive -Path 'release/小宝贝记账本-win32-x64' -DestinationPath 'release/xiaobaobei-ledger-windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: xiaobaobei-ledger-windows-x64
          path: release/xiaobaobei-ledger-windows-x64.zip
          retention-days: 30
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releaseTag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'v1.0.0' }
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --target $env:GITHUB_SHA --title "小宝贝记账本 $releaseTag · 小程序扫码版" --notes '底部点击“打开小宝贝金算盘”即可显示微信小程序码，并支持复制小程序口令。修复预加载脚本影响复制功能的问题。Windows 64 位运行包，请完整解压后运行小宝贝记账本.exe。包含五开记账、跑环记账、总账合并、联系与支持页面。'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $releaseTag 'release/xiaobaobei-ledger-windows-x64.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
